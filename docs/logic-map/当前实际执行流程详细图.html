ont-weight="bold" fill="#0f172a">02.01  拟合前景模型库</text><text x="661" y="300" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">固定几何 PSF 卷积 MGE</text><text x="661" y="327" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">双几何 MGE；有界网格双 Sérsic</text><text x="661" y="354" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">均为前景光模型，不是透镜质量模型</text><path d="M910.0,387 V415" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="645" y="415" width="530" height="147" rx="10" fill="#ffffff" stroke="#94a3b8"/><text x="661" y="444" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">02.02  模型选择与质量记录</text><text x="661" y="475" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">评估模型得分及前景拟合质量</text><text x="661" y="502" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">记录候选、选中方法、质量与失败标记</text><text x="661" y="529" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">成功模型可成为主扣除模型</text><path d="M910.0,562 V590" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="645" y="590" width="530" height="147" rx="10" fill="#ffffff" stroke="#94a3b8"/><text x="661" y="619" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">02.03  主残差与比较残差</text><text x="661" y="650" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">主残差 = 数据 − 选中前景光模型</text><text x="661" y="677" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">保留另一前景扣除用于敏感性比较</text><text x="661" y="704" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">两者来自同一曝光，不是独立观测</text><path d="M910.0,737 V765" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="645" y="765" width="530" height="147" rx="10" fill="#fffbeb" stroke="#94a3b8"/><text x="661" y="794" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">02.04  主模型失败分支</text><text x="661" y="825" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">不运行正式阈值 / SEP / 几何提取</text><text x="661" y="852" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">相应分割、足迹和候选集合置空</text><text x="661" y="879" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">仍保留质量信息，交由后续判断处理</text><path d="M910.0,912 V940" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="645" y="940" width="530" height="147" rx="10" fill="#ffffff" stroke="#94a3b8"/><text x="661" y="969" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">02.05  可选自适应残差噪声校准</text><text x="661" y="1000" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">要求模型成功且 adaptive_residual_snr 开启</text><text x="661" y="1027" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">控制区：r &gt; 1.5 × ring_outer，排除掩膜</text><text x="661" y="1054" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="normal" fill="#334155">至少 100 个有限残差 SNR 像素</text><path d="M910.0,1087 V1115" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="645" y="1115" width="530" height="147" rx="10" fill="#ffffff" stroke="#94a3b8"/><text x="661" y="1144" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="bold" fill="#0f172a">02.06  计算有效检测门槛</text><text x function zoom(s,cx=view.clientWidth/2,cy=view.clientHeight/2){const rx=(view.scrollLeft+cx)/scale,ry=(view.scrollTop+cy)/scale;scale=Math.min(2.5,Math.max(.10,s));canvas.style.width=W*scale+'px';canvas.style.height=H*scale+'px';view.scrollLeft=rx*scale-cx;view.scrollTop=ry*scale-cy;document.getElementById('pct').textContent=Math.round(scale*100)+'%';}

view.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const r=view.getBoundingClientRect();zoom(scale*Math.exp(-e.deltaY*.005),e.clientX-r.left,e.clientY-r.top)}},{passive:false});
let drag=null;view.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button===0){drag={x:e.clientX,y:e.clientY,l:view.scrollLeft,t:view.scrollTop};view.setPointerCapture(e.pointerId)}};view.onpointermove=e=>{if(drag){view.scrollLeft=drag.l-(e.clientX-drag.x);view.scrollTop=drag.t-(e.clientY-drag.y)}};view.onpointerup=()=>drag=null;view.onpointercancel=()=>drag=null;zoom(.65);view.scrollTo(0,0);
