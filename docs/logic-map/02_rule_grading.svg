<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="825" viewBox="0 0 1010 825"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0f172a">规则分类逻辑概览</text><path d="M480.0,151 V175.5 H480.0 V200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="486.0" y="169.5" font-family="sans-serif" font-size="13" fill="#475569">是</text><path d="M480.0,276 V303.0 H275.0 V330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="383.5" y="297.0" font-family="sans-serif" font-size="13" fill="#475569">是</text><path d="M480.0,276 V303.0 H735.0 V330" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="613.5" y="297.0" font-family="sans-serif" font-size="13" fill="#475569">否</text><path d="M275.0,430 V462.5 H275.0 V495" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="281.0" y="456.5" font-family="sans-serif" font-size="13" fill="#475569">无冲突且有支持</text><path d="M275.0,595 V635.0 H480.0 V675" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M735.0,430 V552.5 H480.0 V675" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="75" width="520" height="76" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/><text x="480.0" y="102" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">数据与噪声信息可用吗</text><text x="480.0" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">否 → 证据不足并弃权</text><rect x="220" y="200" width="520" height="76" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><text x="480.0" y="227" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">是否形成清晰透镜构型</text><text x="480.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">空间关系与形态共同支持</text><rect x="70" y="330" width="410" height="100" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="275.0" y="357" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">清晰构型：检查关键冲突</text><text x="275.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">强替代解释或模型符号冲突 → C</text><text x="275.0" y="403" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">可靠颜色冲突或稳健性不足 → B</text><rect x="530" y="330" width="410" height="100" rx="12" fill="#fef3c7" stroke="#cbd5e1"/><text x="735.0" y="357" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">构型不清晰：检查特异性</text><text x="735.0" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">可信且具透镜结构关系 → B</text><text x="735.0" y="403" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">不完整线索 → C；缺乏支持 → X</text><rect x="70" y="495" width="410" height="100" rx="12" fill="#dcfce7" stroke="#cbd5e1"/><text x="275.0" y="522" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">A 类规则条件</text><text x="275.0" y="545" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">清晰构型 + 另一前景模型支持</text><text x="275.0" y="568" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">无上述关键冲突</text><rect x="220" y="675" width="520" height="100" rx="12" fill="#e2e8f0" stroke="#cbd5e1"/><text x="480.0" y="702" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a">规则审计与发布</text><text x="480.0" y="725" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">审计失败不能正常发布 A/B/C</text><text x="480.0" y="748" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0f172a">影子几何建议不会改写正式规则类别</text></svg>