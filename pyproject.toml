[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-expert-agent"
version = "0.11.0"
description = "Evidence-first expert reasoning agent for strong gravitational lens inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "astropy>=7.0",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "photutils>=2.0",
  "Pillow>=10.0",
  "pydantic>=2.10",
  "scipy>=1.14",
  "sep>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lens-agent = "expert_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["expert_agent*"]

[tool.setuptools.package-data]
expert_agent = ["skills/*.md", "knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
